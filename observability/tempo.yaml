# Tempo en modo monolítico con almacenamiento local: suficiente para la demo (los datos se pierden
# al recrear el contenedor). Recibe trazas OTLP de las dos APIs en :4318 (HTTP) y :4317 (gRPC).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
